<header class="navbar-header">
  <div class="header-title">
    <h1>{{ 'NAVBAR.TITULO' | translate }}</h1>
  </div>

  <div class="header-actions">
    <div class="lang-selector">
      <button (click)="cambiarIdioma('es')" [class.active]="idiomaActual === 'es'" class="btn-lang">
        <span class="flag">🇪🇸</span> ES
      </button>
      <button (click)="cambiarIdioma('en')" [class.active]="idiomaActual === 'en'" class="btn-lang">
        <span class="flag">🇺🇸</span> EN
      </button>
    </div>
  </div>
</header>
